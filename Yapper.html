<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗣️ Yapper™ v4.1.4 | MultiAgent AutoChat by Devilish.Dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.0/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Mono&display=swap');

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #e5e5e5;
            overflow-x: hidden;
        }

        .font-mono-code { font-family: 'Space Mono', monospace; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .speaking-shake { animation: shake 0.5s infinite; }
        .avatar-glow-alpha { box-shadow: 0 0 30px rgba(99, 102, 241, 0.6); }
        .avatar-glow-beta { box-shadow: 0 0 30px rgba(16, 185, 129, 0.6); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .setup-card {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-glow { box-shadow: 0 0 20px rgba(79, 70, 229, 0.3); }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); }
        }
        .timer-critical-pulse { animation: pulse-red 1.5s infinite; }

        .voice-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .drop-zone {
            border: 2px dashed rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .drop-zone.drag-over {
            border-color: rgba(99, 102, 241, 0.6);
            background: rgba(99, 102, 241, 0.1);
        }

        @keyframes spin-slow {
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 2s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:#050505;gap:16px;">
            <div style="width:40px;height:40px;border:3px solid #333;border-top-color:#6366f1;border-radius:50%;animation:spin-slow 1s linear infinite;"></div>
            <div style="font-family:Inter,sans-serif;font-size:12px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#444;">Loading Yapper...</div>
        </div>
    </div>

    <script type="text/babel">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useRef, useCallback } = React;

        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const GEMINI_VOICES = ["Zephyr","Puck","Charon","Kore","Fenrir","Leda","Orus","Aoede","Callirrhoe","Autonoe","Enceladus","Iapetus","Umbriel","Algieba","Despina","Erinome","Algenib","Rasalgethi","Laomedeia","Achernar","Alnilam","Schedar","Gacrux","Pulcherrima","Achird","Zubenelgenubi","Vindemiatrix","Sadachbia","Sadaltager","Sulafat"];
        const FISH_LANGUAGES = [
            { code: '', label: 'All Languages' },
            { code: 'en', label: 'English' },
            { code: 'zh', label: 'Chinese' },
            { code: 'ja', label: 'Japanese' },
            { code: 'ko', label: 'Korean' },
            { code: 'es', label: 'Spanish' },
            { code: 'fr', label: 'French' },
            { code: 'de', label: 'German' },
            { code: 'ar', label: 'Arabic' },
            { code: 'pt', label: 'Portuguese' },
            { code: 'ru', label: 'Russian' }
        ];

        // Defensive list extraction — fish.audio has changed payload envelopes before.
        // Never let a shape change become a render crash: unknown shapes -> [].
        const asVoiceList = (data) => {
            if (Array.isArray(data)) return data;
            if (!data || typeof data !== 'object') return [];
            for (const k of ['items', 'data', 'voices', 'models', 'list', 'results']) {
                if (Array.isArray(data[k])) return data[k];
            }
            return [];
        };

        const voiceIdOf = (v) => (v && (v._id || v.id || v.voice_id || v.uuid || v.voiceId)) || '';

        const DEFAULT_CONFIG = {
            apiKey1: '', apiKey2: '',
            model1: 'gemini-3.5-flash', model2: 'deepseek-flash',
            name1: 'Alpha', name2: 'Beta',
            avatar1: 'https://api.dicebear.com/7.x/bottts/svg?seed=Alpha',
            avatar2: 'https://api.dicebear.com/7.x/bottts/svg?seed=Beta',
            persona1: 'A cynical 90s grunge producer.',
            persona2: 'A futuristic pop songwriter.',
            ttsProvider1: 'fish', ttsProvider2: 'fish',
            fishVoiceId1: '', fishVoiceId2: '',
            fishModel1: 's1', fishModel2: 's1',
            fishApiKey: '',
            geminiKey: '',
            voice1: 'Puck', voice2: 'Kore',
            topic: 'Discuss the creative friction between analog and digital workflows.',
            duration: 15
        };

        const pcmToWav = (pcmData, sampleRate = 24000) => {
            const buffer = new ArrayBuffer(44 + pcmData.byteLength);
            const view = new DataView(buffer);
            const writeString = (v, offset, string) => {
                for (let i = 0; i < string.length; i++) v.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcmData.byteLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, pcmData.byteLength, true);
            const pcmView = new Uint8Array(pcmData.buffer, pcmData.byteOffset, pcmData.byteLength);
            const wavView = new Uint8Array(buffer, 44);
            wavView.set(pcmView);
            return new Blob([buffer], { type: 'audio/wav' });
        };

        const base64ToUint8Array = (base64) => {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            return bytes;
        };

        // Endpoint routing: prefer dl_proxy same-origin routes (port 2345) or a
        // configured server base, since api.fish.audio blocks CORS from browsers.
        const fishUrl = (proxyPath, directUrl) => {
            let base = '';
                try { base = (localStorage.getItem('devilish_server_base') || '').replace(/\/+$/, ''); } catch(e) {}
            if (base) return base + proxyPath;
            if (typeof location === 'undefined') return directUrl;
            // Same-origin dl_proxy (desktop/Termux dev server on :2345)
            if (location.protocol.startsWith('http') && String(location.port) === '2345') return proxyPath;
            // Inside the DigiVoX APK (Capacitor/WebView serves from https://localhost):
            // the Termux dl_proxy is reachable on the same device — use it, direct fish.audio is CORS-blocked.
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:2345' + proxyPath;
            return directUrl;
        };
        const FISH_TTS_URL = () => fishUrl('/tts', 'https://api.fish.audio/v1/tts');
        const FISH_LIST_URL = () => fishUrl('/voices', 'https://api.fish.audio/model');
        const FISH_CLONE_URL = () => fishUrl('/clone', 'https://api.fish.audio/model');

        const formatTime = (ms) => {
            const m = Math.floor(ms / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${m}:${s.toString().padStart(2, '0')}`;
        };

        const getTimeContext = (startTime, durationMin) => {
            const now = Date.now();
            const elapsedMs = now - startTime;
            const remainingMs = Math.max(0, durationMin * 60000 - elapsedMs);
            const elapsedMin = Math.floor(elapsedMs / 60000);
            const remainingMin = Math.ceil(remainingMs / 60000);
            let urgency = '';
            if (remainingMin <= 1) urgency = ' TIME IS UP AFTER THIS MESSAGE. Conclude immediately and do not start new threads.';
            else if (remainingMin <= 3) urgency = ' Time is critically low. Wrap up your final thoughts now and land the plane.';
            else if (remainingMin <= 5) urgency = ' Time is running low. Begin transitioning toward a natural conclusion.';
            return `[SESSION CLOCK] Elapsed: ${elapsedMin}m | Remaining: ${remainingMin}m | Total: ${durationMin}m.${urgency}`;
        };


        // React-safe lucide icons: build SVGs directly from lucide icon nodes.
        // (lucide.createIcons() swaps <i> nodes behind React's back and crashes
        //  the tree with removeChild NotFoundError — do NOT use it inside React.)
        const buildSvgNode = (node) => {
            // lucide UMD icon nodes are arrays of [tag, attrs] child tuples;
            // wrap them in a standard lucide <svg> shell.
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '2');
            svg.setAttribute('stroke-linecap', 'round');
            svg.setAttribute('stroke-linejoin', 'round');
            const appendTuple = (el, tuple) => {
                const [tag, attrs, children] = tuple;
                const child = document.createElementNS('http://www.w3.org/2000/svg', tag);
                if (attrs && typeof attrs === 'object') for (const k in attrs) child.setAttribute(k, attrs[k]);
                (children || []).forEach(c => appendTuple(child, c));
                el.appendChild(child);
            };
            (Array.isArray(node) ? node : []).forEach(t => appendTuple(svg, t));
            return svg;
        };
        const iconNodeFor = (name) => {
            if (typeof lucide === 'undefined' || !lucide.icons) return null;
            const norm = String(name).replace(/-/g, '').toLowerCase();
            const key = Object.keys(lucide.icons).find(k => k.replace(/-/g, '').toLowerCase() === norm);
            return key ? lucide.icons[key] : null;
        };
        const Icon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                const host = ref.current;
                if (!host) return;
                host.innerHTML = '';
                const node = iconNodeFor(name);
                if (node) {
                    const svg = buildSvgNode(node);
                    svg.setAttribute('class', className || 'w-4 h-4');
                    host.appendChild(svg);
                }
            }, [name, className]);
            return <span ref={ref} className="inline-flex items-center justify-center shrink-0"></span>;
        };

        // ==========================================
        // Voice Studio Modal
        // ==========================================
        const VoiceStudioModal = ({ agentNum, config, setConfig, fishApiKey, onClose }) => {
            const [myVoices, setMyVoices] = useState([]);
            const [exploreVoices, setExploreVoices] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [language, setLanguage] = useState('');
            const [sortBy, setSortBy] = useState('task_count');
            const [explorePage, setExplorePage] = useState(1);
            const [loadingMy, setLoadingMy] = useState(false);
            const [loadingExplore, setLoadingExplore] = useState(false);
            const [previewingId, setPreviewingId] = useState(null);

            const [cloneFiles, setCloneFiles] = useState([]);
            const [cloneTitle, setCloneTitle] = useState('');
            const [cloneTranscript, setCloneTranscript] = useState('');
            const [cloneDescription, setCloneDescription] = useState('');
            const [cloneTags, setCloneTags] = useState('');
            const [cloneEnhance, setCloneEnhance] = useState(true);
            const [cloning, setCloning] = useState(false);
            const [cloneError, setCloneError] = useState(null);
            const [cloneSuccess, setCloneSuccess] = useState(null);
            const [dragOver, setDragOver] = useState(false);
            const fileInputRef = useRef(null);

            const currentVoiceId = config[`fishVoiceId${agentNum}`];
            const agentName = config[`name${agentNum}`];
            const agentColor = agentNum === 1 ? 'indigo' : 'emerald';

            const fetchMyVoices = useCallback(async () => {
                if (!fishApiKey) return;
                setLoadingMy(true);
                try {
                    const res = await fetch(`${FISH_LIST_URL()}?self=true&page_size=50&sort_by=created_at`, {
                        headers: { 'Authorization': `Bearer ${fishApiKey}` }
                    });
                    if (!res.ok) throw new Error(res.statusText);
                    const data = await res.json();
                    console.log('[Yapper] my-voices payload keys:', Object.keys(data || {}).join(','), '| isArray:', Array.isArray(data));
                    setMyVoices(asVoiceList(data));
                } catch(e) {
                    console.warn('My voices fetch failed:', e);
                    setMyVoices([]);
                }
                setLoadingMy(false);
            }, [fishApiKey]);

            const fetchExplore = useCallback(async () => {
                if (!fishApiKey) return;
                setLoadingExplore(true);
                try {
                    const params = new URLSearchParams({
                        page_size: '20',
                        page_number: String(explorePage),
                        sort_by: sortBy
                    });
                    if (searchQuery.trim()) params.set('title', searchQuery.trim());
                    if (language) params.set('language', language);

                    const res = await fetch(`${FISH_LIST_URL()}?${params}`, {
                        headers: { 'Authorization': `Bearer ${fishApiKey}` }
                    });
                    if (!res.ok) throw new Error(res.statusText);
                    const data = await res.json();
                    console.log('[Yapper] explore payload keys:', Object.keys(data || {}).join(','), '| isArray:', Array.isArray(data));
                    setExploreVoices(asVoiceList(data));
                } catch(e) {
                    console.warn('Explore fetch failed:', e);
                    setExploreVoices([]);
                }
                setLoadingExplore(false);
            }, [fishApiKey, searchQuery, language, sortBy, explorePage]);

            useEffect(() => {
                fetchMyVoices();
            }, [fetchMyVoices]);

            useEffect(() => {
                const t = setTimeout(() => { setExplorePage(1); fetchExplore(); }, 300);
                return () => clearTimeout(t);
            }, [searchQuery, language, sortBy]);

            useEffect(() => {
                fetchExplore();
            }, [explorePage, fetchExplore]);

            const handlePreview = async (voiceId) => {
                if (!fishApiKey || previewingId) return;
                setPreviewingId(voiceId);
                try {
                    const res = await fetch('https://api.fish.audio/v1/tts', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${fishApiKey}`,
                            'Content-Type': 'application/json',
                            'model': 's1'
                        },
                        body: JSON.stringify({
                            text: "Hey there! This is how I sound. Pretty cool, right?",
                            reference_id: voiceId,
                            format: "mp3"
                        })
                    });
                    if (!res.ok) throw new Error('TTS failed');
                    const blob = await res.blob();
                    const audio = new Audio(URL.createObjectURL(blob));
                    audio.onended = () => setPreviewingId(null);
                    audio.onerror = () => setPreviewingId(null);
                    await audio.play();
                } catch(e) {
                    console.warn('Preview failed:', e);
                    setPreviewingId(null);
                }
            };

            const handleSelectVoice = (voiceId) => {
                setConfig(prev => ({
                    ...prev,
                    [`fishVoiceId${agentNum}`]: voiceId,
                    [`ttsProvider${agentNum}`]: 'fish'
                }));
                onClose();
            };

            const handleClone = async () => {
                if (!cloneFiles.length || !cloneTitle.trim()) {
                    setCloneError('Please upload at least one audio file and give your voice a name.');
                    return;
                }
                setCloning(true);
                setCloneError(null);
                setCloneSuccess(null);

                try {
                    const formData = new FormData();
                    formData.append('title', cloneTitle.trim());
                    if (cloneDescription.trim()) formData.append('description', cloneDescription.trim());
                    formData.append('enhance_audio_quality', String(cloneEnhance));
                    formData.append('visibility', 'private');

                    cloneTags.split(',').map(t => t.trim()).filter(Boolean).forEach(tag => {
                        formData.append('tags', tag);
                    });

                    cloneFiles.forEach(file => {
                        formData.append('voices', file);
                        if (cloneTranscript.trim()) {
                            formData.append('texts', cloneTranscript.trim());
                        }
                    });

                    const res = await fetch(FISH_CLONE_URL(), {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${fishApiKey}` },
                        body: formData
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(errText || `HTTP ${res.status}`);
                    }

                    const data = await res.json();
                    const newVoiceId = voiceIdOf(data) || voiceIdOf(data && data.data);

                    setCloneSuccess(`Voice "${cloneTitle.trim()}" created successfully!`);
                    setCloneFiles([]);
                    setCloneTitle('');
                    setCloneTranscript('');
                    setCloneDescription('');
                    setCloneTags('');

                    setConfig(prev => ({
                        ...prev,
                        [`fishVoiceId${agentNum}`]: newVoiceId,
                        [`ttsProvider${agentNum}`]: 'fish'
                    }));
                    fetchMyVoices();

                    setTimeout(() => onClose(), 1200);
                } catch(e) {
                    setCloneError(e.message || 'Clone failed. Check your file format (WAV/MP3/M4A) and API key.');
                }
                setCloning(false);
            };

            const onDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/') || /\.(wav|mp3|m4a|ogg)$/i.test(f.name));
                setCloneFiles(prev => [...prev, ...files].slice(0, 5));
            };

            const onDragOver = (e) => { e.preventDefault(); setDragOver(true); };
            const onDragLeave = () => setDragOver(false);

            const VoiceCard = ({ voice, isSelected }) => (
                <div className={`voice-card bg-neutral-900 border ${isSelected ? `border-${agentColor}-500` : 'border-neutral-800'} rounded-[2rem] p-5 transition-all duration-300 flex flex-col gap-3`}>
                    <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                            <h4 className="text-sm font-black text-white truncate">{voice.title || 'Untitled'}</h4>
                            <p className="text-[10px] text-neutral-500 mt-1 line-clamp-2">{voice.description || 'No description'}</p>
                        </div>
                        {isSelected && (
                            <span className={`shrink-0 px-2 py-1 rounded-lg bg-${agentColor}-500/20 text-${agentColor}-400 text-[9px] font-black uppercase tracking-widest border border-${agentColor}-500/30`}>Active</span>
                        )}
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                        {(voice.tags || []).slice(0, 3).map((tag, i) => (
                            <span key={i} className="px-2 py-0.5 rounded-md bg-neutral-800 text-neutral-400 text-[9px] font-bold uppercase">{tag}</span>
                        ))}
                        {voice.language && (
                            <span className="px-2 py-0.5 rounded-md bg-neutral-800 text-neutral-400 text-[9px] font-bold uppercase">{voice.language}</span>
                        )}
                    </div>
                    <div className="flex gap-2 mt-auto pt-1">
                        <button
                            onClick={() => handlePreview(voiceIdOf(voice))}
                            disabled={previewingId === voiceIdOf(voice)}
                            className="flex-1 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-neutral-300 hover:text-white text-[9px] font-black uppercase tracking-widest py-2.5 rounded-xl transition-all flex items-center justify-center gap-1.5 disabled:opacity-50"
                        >
                            {previewingId === voiceIdOf(voice) ? (
                                <><Icon name="loader-2" className="w-3 h-3 animate-spin"/> Playing...</>
                            ) : (
                                <><Icon name="play" className="w-3 h-3"/> Preview</>
                            )}
                        </button>
                        <button
                            onClick={() => handleSelectVoice(voiceIdOf(voice))}
                            className={`flex-1 bg-${agentColor}-600 hover:bg-${agentColor}-500 text-white text-[9px] font-black uppercase tracking-widest py-2.5 rounded-xl transition-all flex items-center justify-center gap-1.5`}
                        >
                            <Icon name="check" className="w-3 h-3"/> Use Voice
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4" onClick={onClose}>
                    <div 
                        className="bg-neutral-950 border border-neutral-800 rounded-[3rem] w-full max-w-5xl max-h-[92vh] overflow-y-auto hide-scrollbar shadow-2xl flex flex-col"
                        onClick={e => e.stopPropagation()}
                    >
                        {/* Header */}
                        <div className="sticky top-0 bg-neutral-950/95 backdrop-blur-md z-10 px-8 py-6 border-b border-neutral-800 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className={`p-3 bg-${agentColor}-600 rounded-2xl`}>
                                    <Icon name="mic-2" className="w-5 h-5 text-white"/>
                                </div>
                                <div>
                                    <h2 className="text-lg font-black text-white">Voice Studio</h2>
                                    <p className="text-[10px] text-neutral-500 font-black uppercase tracking-widest">Configuring voice for {agentName}</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-3 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-2xl text-neutral-400 hover:text-white transition-all">
                                <Icon name="x" className="w-5 h-5"/>
                            </button>
                        </div>

                        <div className="p-8 space-y-10">
                            {!fishApiKey && (
                                <div className="bg-red-900/20 border border-red-500/30 rounded-[2rem] p-6 text-center">
                                    <Icon name="alert-circle" className="w-6 h-6 text-red-400 mx-auto mb-2"/>
                                    <p className="text-sm font-bold text-red-300">No fish.audio API Key found</p>
                                    <p className="text-[11px] text-red-400/70 mt-1">Add your key in the Voice Engine Bay below to browse and clone voices.</p>
                                </div>
                            )}

                            {/* Current Selection */}
                            {currentVoiceId && (
                                <div className="space-y-3">
                                    <h3 className="text-[10px] font-black text-neutral-500 uppercase tracking-[0.3em]">Currently Selected</h3>
                                    <div className={`bg-${agentColor}-900/10 border border-${agentColor}-500/30 rounded-[2rem] p-5 flex items-center justify-between`}>
                                        <div className="flex items-center gap-4">
                                            <div className={`p-3 bg-${agentColor}-600/20 rounded-xl`}>
                                                <Icon name="volume-2" className={`w-5 h-5 text-${agentColor}-400`}/>
                                            </div>
                                            <div>
                                                <p className="text-sm font-bold text-white font-mono-code">{currentVoiceId}</p>
                                                <p className="text-[10px] text-neutral-500">Community voice ID</p>
                                            </div>
                                        </div>

                                <button onClick={() => onPreviewVoice(num)} className="w-full bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 hover:border-indigo-500 text-neutral-300 hover:text-white text-[9px] font-black uppercase tracking-widest py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                                    <Icon name="play-circle" className="w-3 h-3"/> Preview Voice
                                </button>

                                <div className="space-y-2">
                                    <label className="text-[10px] font-black uppercase text-neutral-500 tracking-widest px-1">Behavioral Script</label>
                                    <textarea className="w-full bg-neutral-900 border border-neutral-800 p-5 rounded-[2rem] text-sm h-36 resize-none outline-none focus:border-neutral-600 leading-relaxed" placeholder="Persona Instructions..." value={config[`persona${num}`]} onChange={e => setConfig({...config, [`persona${num}`]: e.target.value})} />
                                </div>
                            </div>
                        </div>
                    ))}
                </div>

                {/* Voice Engine Bay */}
                <div className="mt-8 setup-card p-8 rounded-[3rem] border border-neutral-800 max-w-4xl mx-auto">
                    <h3 className="text-xs font-black uppercase tracking-widest text-cyan-400 mb-6 text-center">Voice Engine Bay</h3>
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="space-y-2">
                            <label className="text-[9px] font-black text-neutral-500 uppercase tracking-widest px-1">fish.audio API Key</label>
                            <input type="password" placeholder="fish_xxxxxxxx..." className="w-full bg-neutral-900 border border-neutral-800 p-4 rounded-2xl text-sm outline-none focus:border-cyan-600" value={config.fishApiKey} onChange={e => setConfig({...config, fishApiKey: e.target.value})} />
                            <p className="text-[9px] text-neutral-600 px-1">Powers neural voices. Get yours at <span className="text-cyan-500">fish.audio</span></p>
                        </div>
                        <div className="space-y-2">
                            <label className="text-[9px] font-black text-neutral-500 uppercase tracking-widest px-1">Google Gemini API Key</label>
                            <input type="password" placeholder="AIza..." className="w-full bg-neutral-900 border border-neutral-800 p-4 rounded-2xl text-sm outline-none focus:border-cyan-600" value={config.geminiKey} onChange={e => setConfig({...config, geminiKey: e.target.value})} />
                            <p className="text-[9px] text-neutral-600 px-1">Powers Gemini TTS voices. Same key works for Gemini brain models.</p>
                        </div>
                    </div>
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="space-y-2">
                            <label className="text-[9px] font-black text-neutral-500 uppercase tracking-widest px-1">Session Duration</label>
                            <div className="flex items-center gap-4 bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">
                                <input type="range" min="5" max="60" step="5" value={config.duration} onChange={e => setConfig({...config, duration: parseInt(e.target.value)})} className="flex-1 accent-indigo-500" />
                                <span className="text-sm font-black text-white w-16 text-right">{config.duration}m</span>
                            </div>
                            <p className="text-[9px] text-neutral-600 px-1">Agents will be told the clock and urged to wrap up before time expires.</p>
                        </div>
                    </div>
                </div>

                <div className="mt-8 setup-card p-10 rounded-[3.5rem] border border-neutral-800 max-w-4xl mx-auto shadow-2xl">
                    <label className="text-[10px] font-black text-neutral-500 uppercase tracking-[0.4em] block mb-5 text-center">Conflict Catalyst</label>
                    <textarea placeholder="Objective of this session..." className="w-full bg-neutral-950 border border-neutral-800 p-6 rounded-[2rem] text-lg outline-none focus:border-indigo-500 text-center leading-relaxed h-32 resize-none" value={config.topic} onChange={e => setConfig({...config, topic: e.target.value})} />
                    <div className="mt-5 flex items-center justify-center gap-3">
                        <label className="flex items-center gap-2 cursor-pointer bg-neutral-900 hover:bg-neutral-800 border border-dashed border-neutral-700 hover:border-indigo-500 text-neutral-400 hover:text-white text-[9px] font-black uppercase tracking-widest px-5 py-3 rounded-xl transition-all">
                            <Icon name="file-text" className="w-3 h-3"/> Upload Doc (.txt / .pdf)
                            <input type="file" accept=".txt,.pdf" className="hidden" onChange={handleDocUpload} />
                        </label>
                    </div>
                    <button onClick={onStart} className="w-full mt-8 bg-indigo-600 btn-glow p-8 rounded-[2rem] font-black text-sm uppercase tracking-[0.6em] hover:bg-indigo-500 transition-all active:scale-[0.98] text-white">
                        Unleash The Chaos
                    </button>
                </div>
            </div>
        );

        // --- Chaos Arena ---
        const ChaosArena = ({ config, chatLog, currentSpeaker, isSpeaking, isMuted, isRunning, onBack, onToggleMute, scrollRef, timeLeftMs }) => {
            const totalMs = config.duration * 60000;
            const pct = totalMs > 0 ? Math.max(0, Math.min(100, (timeLeftMs / totalMs) * 100)) : 0;
            const isLow = timeLeftMs !== null && timeLeftMs < 300000;
            return (
                <div className="w-full max-w-6xl h-[95vh] flex flex-col animate-in slide-in-from-bottom-12 duration-1000">
                    <div className="flex justify-between items-center mb-4 bg-neutral-900/40 p-4 rounded-[2rem] border border-neutral-800 backdrop-blur-md">
                        <button onClick={onBack} className="flex items-center gap-3 text-[10px] font-black uppercase tracking-widest text-neutral-500 hover:text-white transition-all px-4">
                            <Icon name="arrow-left" className="w-4 h-4"/> Adjust Script
                        </button>

                        <div className="flex-1 max-w-xs mx-4">
                            <div className="flex justify-between text-[9px] font-black uppercase tracking-widest text-neutral-500 mb-1">
                                <span>Session</span>
                                <span className={isLow ? 'text-red-400' : 'text-emerald-400'}>{timeLeftMs !== null ? formatTime(timeLeftMs) : '--:--'}</span>
                            </div>
                            <div className="h-1.5 bg-neutral-800 rounded-full overflow-hidden">
                                <div className={`h-full rounded-full transition-all duration-1000 ${isLow ? 'bg-red-500' : 'bg-indigo-500'}`} style={{ width: `${pct}%` }} />
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <button onClick={onToggleMute} className={`p-4 rounded-full border transition-all ${isMuted ? 'bg-red-500/10 border-red-500/30 text-red-500 shadow-lg shadow-red-500/10' : 'bg-neutral-800 border-neutral-700 text-neutral-400 hover:text-white'}`}>
                                <Icon name={isMuted ? "volume-x" : "volume-2"}/>
                            </button>
                        </div>
                    </div>

                    <div className="flex justify-around items-end mb-6 relative px-4 shrink-0">
                        <div className="absolute inset-x-0 bottom-0 h-[2px] bg-gradient-to-r from-transparent via-neutral-800 to-transparent"></div>
                        {[1, 2].map(num => (
                            <div key={num} className="flex flex-col items-center gap-3 transition-all duration-500">
                                <div className={`transition-all duration-500 ${currentSpeaker === num && isSpeaking ? `scale-110 speaking-shake avatar-glow-${num === 1 ? 'alpha' : 'beta'}` : 'scale-90 opacity-40 blur-[1px]'}`}>
                                    <img src={config[`avatar${num}`]} className="w-24 h-24 md:w-36 md:h-36 rounded-[2rem] object-cover border-4 border-neutral-950 shadow-2xl bg-neutral-900" />
                                </div>
                                <div className={`px-3 py-1 rounded-full border ${currentSpeaker === num && isSpeaking ? (num === 1 ? 'bg-indigo-600 border-indigo-400' : 'bg-emerald-600 border-emerald-400') : 'bg-neutral-900 border-neutral-800'}`}>
                                    <span className="text-[10px] font-black uppercase tracking-[0.2em]">{config[`name${num}`]}</span>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="flex-1 min-h-0 bg-neutral-950/50 border border-neutral-800 rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col mb-4">
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 md:p-8 space-y-5 hide-scrollbar">
                            {chatLog.map((m, i) => (
                                <div key={i} className={`flex gap-6 ${m.speaker === 2 ? 'flex-row-reverse' : ''} animate-in fade-in slide-in-from-bottom-6 duration-700`}>
                                    <div className={`max-w-[75%] space-y-3 ${m.speaker === 2 ? 'items-end flex flex-col text-right' : ''}`}>
                                        <div className="flex items-center gap-3 px-2">
                                            <span className={`text-[11px] font-black uppercase tracking-[0.2em] ${m.speaker === 1 ? 'text-indigo-400' : 'text-emerald-400'}`}>{m.name}</span>
                                            <span className="text-[9px] text-neutral-700 font-mono-code leading-none">[{m.time}]</span>
                                        </div>
                                        <div className={`p-5 md:p-6 rounded-[1.75rem] text-sm md:text-[15px] leading-relaxed shadow-2xl ${m.speaker === 1 ? 'bg-neutral-900 border border-neutral-800 rounded-tl-none text-neutral-100 shadow-indigo-900/5' : 'bg-indigo-600 text-white rounded-tr-none shadow-indigo-700/20'}`}>
                                            {m.text}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {isRunning && !isSpeaking && (
                                <div className={`flex gap-6 ${currentSpeaker === 2 ? 'flex-row-reverse' : ''}`}>
                                    <div className="bg-neutral-800/40 px-8 py-5 rounded-[2rem] flex gap-2.5 items-center backdrop-blur-sm">
                                        <div className="w-2 h-2 bg-indigo-500 rounded-full animate-bounce"></div>
                                        <div className="w-2 h-2 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                                        <div className="w-2 h-2 bg-indigo-300 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // =====================
        // --- App Controller ---
        // =====================
        const App = () => {
            const [view, setView] = useState('setup');
            const [config, setConfig] = useState(() => {
                let base = DEFAULT_CONFIG;
                try {
                    const saved = localStorage.getItem('yapper_autosave');
                    if (saved) base = { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
                } catch(e) {}
                // Migrate retired DeepSeek model IDs (deepseek-chat / deepseek-reasoner
                // were retired from the API in July 2026)
                const DS_MIGRATE = { 'deepseek-chat': 'deepseek-flash', 'deepseek-reasoner': 'deepseek-v4-pro' };
                if (DS_MIGRATE[base.model1]) base.model1 = DS_MIGRATE[base.model1];
                if (DS_MIGRATE[base.model2]) base.model2 = DS_MIGRATE[base.model2];
                const globalFish = localStorage.getItem('devilish_fish_key') || '';
                const globalGemini = localStorage.getItem('devilish_gemini_key') || '';
                if (!base.fishApiKey && globalFish) base.fishApiKey = globalFish;
                if (globalGemini && !base.geminiKey) base.geminiKey = globalGemini;
                if (globalGemini) {
                    if (!base.apiKey1) { base.apiKey1 = globalGemini; base.model1 = 'gemini-3.5-flash'; }
                    if (!base.apiKey2) { base.apiKey2 = globalGemini; base.model2 = 'gemini-3.5-flash'; }
                }
                return base;
            });
            const [chatLog, setChatLog] = useState([]);
            const [isRunning, setIsRunning] = useState(false);
            const [currentSpeaker, setCurrentSpeaker] = useState(1);
            const [error, setError] = useState(null);
            const [browserVoices, setBrowserVoices] = useState([]);
            const [isMuted, setIsMuted] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [showSavedPersonas, setShowSavedPersonas] = useState(false);
            const [sessionStartTime, setSessionStartTime] = useState(null);
            const [timeLeftMs, setTimeLeftMs] = useState(null);
            const [voiceStudioAgent, setVoiceStudioAgent] = useState(null);

            const isMutedRef = useRef(false);
            const sessionRef = useRef(0); // increments to abort a running chat loop
            const configRef = useRef(config);
            const browserVoicesRef = useRef([]);
            const audioRef = useRef(null);
            const scrollRef = useRef(null);
            const synth = typeof window !== 'undefined' ? window.speechSynthesis : null;

            // Auto-save config to localStorage
            useEffect(() => {
                try {
                    localStorage.setItem('yapper_autosave', JSON.stringify(config));
                } catch(e) {}
            }, [config]);

            useEffect(() => { isMutedRef.current = isMuted; }, [isMuted]);
            useEffect(() => { configRef.current = config; }, [config]);
            useEffect(() => { browserVoicesRef.current = browserVoices; }, [browserVoices]);

            useEffect(() => {
                const loadVoices = () => {
                    if (synth && typeof synth.getVoices === 'function') {
                        setBrowserVoices(synth.getVoices() || []);
                    } else {
                        setBrowserVoices([]);
                    }
                };
                loadVoices();
                if (synth) {
                    synth.onvoiceschanged = loadVoices;
                }
            }, []);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [chatLog, view, voiceStudioAgent]);

            useEffect(() => {
                if (!sessionStartTime || !isRunning) {
                    setTimeLeftMs(null);
                    return;
                }
                const tick = () => {
                    const elapsed = Date.now() - sessionStartTime;
                    const remaining = Math.max(0, configRef.current.duration * 60000 - elapsed);
                    setTimeLeftMs(remaining);
                    if (remaining <= 0) setIsRunning(false);
                };
                tick();
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, [sessionStartTime, isRunning]);

            const speakWithRefs = async (text, agentNum) => {
                if (isMutedRef.current || !text) return;
                setIsSpeaking(true);
                const cfg = configRef.current;
                const provider = cfg[`ttsProvider${agentNum}`];

                if (provider === 'fish' && cfg.fishApiKey) {
                    try {
                        const fishVoiceId = cfg[`fishVoiceId${agentNum}`];
                        const fishModel = cfg[`fishModel${agentNum}`];
                        const headers = {
                            'Authorization': `Bearer ${cfg.fishApiKey}`,
                            'Content-Type': 'application/json'
                        };
                        if (!fishVoiceId) headers['model'] = fishModel;
                        const body = { text, format: 'mp3', chunk_length: 200 };
                        if (fishVoiceId) body.reference_id = fishVoiceId;

                        const response = await fetch(FISH_TTS_URL(), {
                            method: 'POST',
                            headers,
                            body: JSON.stringify(body)
                        });
                        if (!response.ok) throw new Error(`Fish Audio HTTP ${response.status}`);
                        const audioBlob = await response.blob();
                        const audioUrl = URL.createObjectURL(audioBlob);
                        if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
                        const audio = new Audio(audioUrl);
                        audioRef.current = audio;
                        await new Promise(resolve => {
                            audio.onended = resolve;
                            audio.onerror = resolve;
                            audio.play().catch(resolve);
                        });
                        setIsSpeaking(false);
                        return;
                    } catch(e) {
                        console.warn("Fish Audio TTS failed, falling back:", e);
                    }
                }

                if (provider === 'gemini') {
                    const geminiKey = cfg.geminiKey || cfg[`apiKey${agentNum}`];
                    const voiceName = cfg[`voice${agentNum}`];
                    if (GEMINI_VOICES.includes(voiceName) && geminiKey) {
                        try {
                            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-tts-preview:generateContent?key=${geminiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text }] }],
                                    generationConfig: {
                                        responseModalities: ["AUDIO"],
                                        speechConfig: {
                                            voiceConfig: { prebuiltVoiceConfig: { voiceName } }
                                        }
                                    }
                                })
                            });
                            if (!response.ok) throw new Error(`TTS HTTP ${response.status}`);
                            const data = await response.json();
                            const audioData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                            if (audioData) {
                                const pcmData = base64ToUint8Array(audioData);
                                const wavBlob = pcmToWav(pcmData);
                                const audioUrl = URL.createObjectURL(wavBlob);
                                if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
                                const audio = new Audio(audioUrl);
                                audioRef.current = audio;
                                await new Promise(resolve => {
                                    audio.onended = resolve;
                                    audio.onerror = resolve;
                                    audio.play().catch(resolve);
                                });
                                setIsSpeaking(false);
                                return;
                            }
                        } catch(e) {
                            console.warn("Gemini TTS failed, falling back:", e);
                        }
                    }
                }

                if (synth && typeof window.SpeechSynthesisUtterance !== 'undefined') {
                    await new Promise(resolve => {
                        try {
                            synth.cancel();
                            const utterance = new SpeechSynthesisUtterance(text);
                            const selected = browserVoicesRef.current.find(v => v.name === cfg[`voice${agentNum}`]);
                            if (selected) utterance.voice = selected;
                            utterance.onend = resolve;
                            utterance.onerror = resolve;
                            synth.speak(utterance);
                        } catch (e) {
                            resolve();
                        }
                    });
                }
                setIsSpeaking(false);
            };

            const handlePreviewVoice = async (agentNum) => {
                const cfg = configRef.current;
                const provider = cfg[`ttsProvider${agentNum}`];
                const sampleText = "Hey there, this is what I sound like. Ready to roll!";

                if (provider === 'fish' && cfg.fishApiKey) {
                    try {
                        const fishVoiceId = cfg[`fishVoiceId${agentNum}`];
                        const fishModel = cfg[`fishModel${agentNum}`];
                        const headers = {
                            'Authorization': `Bearer ${cfg.fishApiKey}`,
                            'Content-Type': 'application/json'
                        };
                        if (!fishVoiceId) headers['model'] = fishModel;
                        const body = { text: sampleText, format: 'mp3', chunk_length: 200 };
                        if (fishVoiceId) body.reference_id = fishVoiceId;

                        const response = await fetch(FISH_TTS_URL(), {
                            method: 'POST',
                            headers,
                            body: JSON.stringify(body)
                        });
                        if (!response.ok) throw new Error(`Preview HTTP ${response.status}`);
                        const audioBlob = await response.blob();
                        const audio = new Audio(URL.createObjectURL(audioBlob));
                        audio.play().catch(console.warn);
                        return;
                    } catch(e) { console.warn("Fish preview failed:", e); }
                }

                if (provider === 'gemini') {
                    const geminiKey = cfg.geminiKey || cfg[`apiKey${agentNum}`];
                    const voiceName = cfg[`voice${agentNum}`];
                    if (GEMINI_VOICES.includes(voiceName) && geminiKey) {
                        try {
                            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-tts-preview:generateContent?key=${geminiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: sampleText }] }],
                                    generationConfig: {
                                        responseModalities: ["AUDIO"],
                                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } }
                                    }
                                })
                            });
                            if (!response.ok) throw new Error(`Preview TTS HTTP ${response.status}`);
                            const data = await response.json();
                            const audioData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                            if (audioData) {
                                const pcmData = base64ToUint8Array(audioData);
                                const wavBlob = pcmToWav(pcmData);
                                const audio = new Audio(URL.createObjectURL(wavBlob));
                                audio.play().catch(console.warn);
                                return;
                            }
                        } catch(e) { console.warn("Gemini preview failed:", e); }
                    }
                }

                if (synth && typeof window.SpeechSynthesisUtterance !== 'undefined') {
                    try {
                        synth.cancel();
                        const utterance = new SpeechSynthesisUtterance(sampleText);
                        const selected = browserVoicesRef.current.find(v => v.name === cfg[`voice${agentNum}`]);
                        if (selected) utterance.voice = selected;
                        synth.speak(utterance);
                    } catch (e) {
                        console.warn("Browser SpeechSynthesis preview failed:", e);
                    }
                }
            };

            const handleFileUpload = (e, num) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => setConfig(prev => ({...prev, [`avatar${num}`]: ev.target.result}));
                reader.readAsDataURL(file);
            };

            const handleDocUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.name.endsWith('.pdf')) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = '';
                        for (let i = 1; i <= Math.min(pdf.numPages, 5); i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                        }
                        setConfig(prev => ({...prev, topic: fullText.trim().slice(0, 800)}));
                    } catch(err) {
                        console.warn("PDF parse error:", err);
                        setError("Could not parse PDF. Try a .txt file instead.");
                    }
                } else {
                    const reader = new FileReader();
                    reader.onload = ev => setConfig(prev => ({...prev, topic: ev.target.result.slice(0, 800)}));
                    reader.readAsText(file, 'UTF-8');
                }
            };

            const handleSavePersonas = () => {
                try {
                    const raw = localStorage.getItem('yapper_personas');
                    const existing = raw ? JSON.parse(raw) : [];
                    const entry = { ...config, savedAt: new Date().toLocaleString() };
                    existing.push(entry);
                    localStorage.setItem('yapper_personas', JSON.stringify(existing));
                    const blob = new Blob([JSON.stringify(entry, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `yapper-persona-${config.name1}-${config.name2}-${Date.now()}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch(e) { console.warn("Save error:", e); }
            };

            const handleLoadPersona = (p) => {
                const { savedAt, ...rest } = p;
                setConfig(rest);
            };

            const callGemini = async (apiKey, modelName, persona, neutralHistory, topic, isFirstTurn, timeContext) => {
                const systemText = `${persona}\n\n${timeContext}`;
                const contents = isFirstTurn
                    ? [{ role: 'user', parts: [{ text: `Start a conversation about: ${topic}` }] }]
                    : neutralHistory.map(m => ({
                        role: m.role === 'assistant' ? 'model' : 'user',
                        parts: [{ text: m.text }]
                    }));

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemText }] },
                        contents,
                        generationConfig: { maxOutputTokens: 400, temperature: 1.0 }
                    })
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || `Gemini HTTP ${response.status}`);
                }
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '...';
            };

            const callDeepSeek = async (apiKey, modelName, persona, neutralHistory, topic, isFirstTurn, timeContext) => {
                const messages = [{ role: 'system', content: `${persona}\n\n${timeContext}` }];
                if (isFirstTurn) {
                    messages.push({ role: 'user', content: `Start a conversation about: ${topic}` });
                } else {
                    neutralHistory.forEach(m => messages.push({
                        role: m.role === 'assistant' ? 'assistant' : 'user',
                        content: m.text
                    }));
                }
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: modelName, messages, max_tokens: 400, temperature: 1.0 })
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || `DeepSeek HTTP ${response.status}`);
                }
                const data = await response.json();
                return data.choices?.[0]?.message?.content?.trim() || '...';
            };

            const runChatLoop = async (cfg, sess) => {
                setIsRunning(true);
                setError(null);
                const startTime = Date.now();
                setSessionStartTime(startTime);

                const historyA = [];
                const historyB = [];
                let speaker = 1;

                for (let turn = 0; turn < 200; turn++) {
                    if (sess !== undefined && sessionRef.current !== sess) return; // aborted via Back
                    const elapsedMin = (Date.now() - startTime) / 60000;
                    if (elapsedMin >= cfg.duration) break;

                    const num = speaker;
                    const otherNum = num === 1 ? 2 : 1;
                    const apiKey = cfg[`apiKey${num}`];
                    const model = cfg[`model${num}`];
                    const persona = cfg[`persona${num}`];
                    const name = cfg[`name${num}`];
                    const history = num === 1 ? historyA : historyB;
                    const isFirstTurn = history.length === 0;
                    const timeContext = getTimeContext(startTime, cfg.duration);

                    setCurrentSpeaker(num);
                    setIsSpeaking(false);

                    try {
                        let reply;
                        if (model.includes('gemini')) {
                            reply = await callGemini(apiKey, model, persona, history, cfg.topic, isFirstTurn, timeContext);
                        } else {
                            reply = await callDeepSeek(apiKey, model, persona, history, cfg.topic, isFirstTurn, timeContext);
                        }

                        history.push({ role: 'assistant', text: reply });
                        const otherHistory = num === 1 ? historyB : historyA;
                        otherHistory.push({ role: 'user', text: reply });

                        while (history.length > 16) history.shift();
                        while (otherHistory.length > 16) otherHistory.shift();

                        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const speakPromise = speakWithRefs(reply, num);
                        setChatLog(prev => [...prev, { speaker: num, name, text: reply, time }]);
                        await speakPromise;

                    } catch(e) {
                        if (sessionRef.current !== sess) return; // aborted, not a real error
                        setError(`Agent ${name} error: ${e.message}`);
                        setIsRunning(false);
                        setIsSpeaking(false);
                        return;
                    }

                    speaker = otherNum;
                }

                if (sessionRef.current === sess) {
                    setIsRunning(false);
                    setIsSpeaking(false);
                }
            };

            const handleStart = () => {
                setChatLog([]);
                setCurrentSpeaker(1);
                setView('chat');
                const sess = ++sessionRef.current;
                const cfgSnapshot = { ...configRef.current };
                setTimeout(() => runChatLoop(cfgSnapshot, sess), 300);
            };

            const stopAudio = () => {
                if (synth && typeof synth.cancel === 'function') {
                    try { synth.cancel(); } catch(e) {}
                }
                if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
            };

            const handleBack = () => {
                sessionRef.current++; // abort the loop, wherever it is
                stopAudio();
                setIsRunning(false);
                setIsSpeaking(false);
                setSessionStartTime(null);
                setTimeLeftMs(null);
                setView('setup');
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-start pt-10 pb-20 px-4">
                    <a href="index.html" style={{position:'fixed',top:'14px',left:'14px',zIndex:200,display:'flex',alignItems:'center',gap:'5px',color:'rgba(255,255,255,0.4)',fontSize:'0.72rem',fontWeight:700,textDecoration:'none',letterSpacing:'0.3px',padding:'5px 10px',borderRadius:'20px',border:'1px solid rgba(255,255,255,0.08)',background:'rgba(255,255,255,0.04)'}}>← Hub</a>
                    {voiceStudioAgent && (
                        <VoiceStudioModal
                            agentNum={voiceStudioAgent}
                            config={config}
                            setConfig={setConfig}
                            fishApiKey={config.fishApiKey}
                            onClose={() => setVoiceStudioAgent(null)}
                        />
                    )}

                    {showSavedPersonas && (
                        <SavedPersonasTab onLoad={handleLoadPersona} onClose={() => setShowSavedPersonas(false)} />
                    )}

                    {error && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-red-900/90 border border-red-500/50 text-red-200 px-8 py-4 rounded-2xl text-sm font-bold backdrop-blur-md shadow-2xl max-w-md text-center">
                            ⚠️ {error}
                        </div>
                    )}

                    {view === 'setup' ? (
                        <SetupScreen
                            config={config}
                            setConfig={setConfig}
                            browserVoices={browserVoices}
                            onStart={handleStart}
                            handleFileUpload={handleFileUpload}
                            handleDocUpload={handleDocUpload}
                            onPreviewVoice={handlePreviewVoice}
                            onSave={handleSavePersonas}
                            onOpenSaved={() => setShowSavedPersonas(true)}
                            onOpenVoiceStudio={setVoiceStudioAgent}
                        />
                    ) : (
                        <ChaosArena
                            config={config}
                            chatLog={chatLog}
                            currentSpeaker={currentSpeaker}
                            isSpeaking={isSpeaking}
                            isMuted={isMuted}
                            isRunning={isRunning}
                            onBack={handleBack}
                            onToggleMute={() => { isMutedRef.current = !isMutedRef.current; setIsMuted(m => !m); if (isMutedRef.current) stopAudio(); }}
                            scrollRef={scrollRef}
                            timeLeftMs={timeLeftMs}
                        />
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
